<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 900" width="2200" height="900">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D0628"/>
      <stop offset="50%" stop-color="#1A0A3E"/>
      <stop offset="100%" stop-color="#2D1060"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#3A9AD9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3A9AD9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Sky background -->
  <rect width="2200" height="900" fill="url(#skyGrad)"/>
  <rect width="2200" height="900" fill="url(#moonGlow)"/>
  <!-- Stars -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="120" cy="60" r="1.5"/><circle cx="340" cy="40" r="1"/><circle cx="580" cy="80" r="2"/>
    <circle cx="780" cy="30" r="1.5"/><circle cx="1020" cy="55" r="1"/><circle cx="1200" cy="70" r="2"/>
    <circle cx="1450" cy="35" r="1.5"/><circle cx="1680" cy="65" r="1"/><circle cx="1900" cy="45" r="2"/>
    <circle cx="2100" cy="75" r="1.5"/><circle cx="200" cy="130" r="1"/><circle cx="450" cy="110" r="2"/>
    <circle cx="700" cy="140" r="1.5"/><circle cx="900" cy="95" r="1"/><circle cx="1100" cy="120" r="2"/>
    <circle cx="1350" cy="85" r="1.5"/><circle cx="1600" cy="115" r="1"/><circle cx="1800" cy="100" r="2"/>
    <circle cx="2050" cy="130" r="1.5"/><circle cx="60" cy="180" r="1"/><circle cx="290" cy="165" r="2"/>
  </g>
  <!-- Rune symbols -->
  <g fill="none" stroke="#3A9AD9" stroke-width="1.5" opacity="0.35">
    <path d="M300 80 L310 60 L320 80 M305 75 L315 75"/>
    <path d="M1100 50 L1110 30 L1120 50 M1105 45 L1115 45"/>
    <path d="M1800 90 L1810 70 L1820 90 M1805 85 L1815 85"/>
    <path d="M550 40 L560 60 L570 40 L575 60"/>
    <path d="M1650 55 L1660 35 L1670 55 L1675 35"/>
  </g>
  <!-- Floating islands -->
  <g opacity="0.5">
    <!-- Island 1 -->
    <ellipse cx="400" cy="220" rx="120" ry="30" fill="#2D6A4F"/>
    <rect x="310" y="170" width="15" height="50" fill="#1a3d2b"/>
    <ellipse cx="317" cy="165" rx="20" ry="25" fill="#4CAF50" opacity="0.9"/>
    <rect x="450" y="175" width="12" height="45" fill="#1a3d2b"/>
    <ellipse cx="456" cy="170" rx="16" ry="20" fill="#4CAF50" opacity="0.9"/>
    <!-- Island 2 -->
    <ellipse cx="1700" cy="180" rx="100" ry="25" fill="#2D6A4F"/>
    <rect x="1650" y="135" width="12" height="45" fill="#1a3d2b"/>
    <ellipse cx="1656" cy="130" rx="18" ry="22" fill="#4CAF50" opacity="0.9"/>
    <rect x="1740" y="140" width="10" height="40" fill="#1a3d2b"/>
    <ellipse cx="1745" cy="135" rx="14" ry="18" fill="#4CAF50" opacity="0.9"/>
    <!-- Island 3 -->
    <ellipse cx="1100" cy="150" rx="80" ry="20" fill="#2D1B4E"/>
    <path d="M1060 150 Q1100 120 1140 150" fill="#7B2FBE" opacity="0.6"/>
  </g>
  <!-- Moon/magic orb -->
  <circle cx="1100" cy="100" r="40" fill="#3A9AD9" opacity="0.12"/>
  <circle cx="1100" cy="100" r="28" fill="#3A9AD9" opacity="0.18"/>
  <circle cx="1100" cy="100" r="18" fill="#ffffff" opacity="0.15"/>
  <!-- Horizon glow -->
  <ellipse cx="1100" cy="900" rx="800" ry="200" fill="#4CAF50" opacity="0.06"/>
