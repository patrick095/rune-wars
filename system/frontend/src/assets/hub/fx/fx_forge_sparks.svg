<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <style>
    @keyframes spark1 { 0% { opacity:1; transform:translate(0,0) scale(1); } 100% { opacity:0; transform:translate(-15px,-25px) scale(0.2); } }
    @keyframes spark2 { 0% { opacity:1; transform:translate(0,0) scale(1); } 100% { opacity:0; transform:translate(10px,-30px) scale(0.2); } }
    @keyframes spark3 { 0% { opacity:1; transform:translate(0,0) scale(1); } 100% { opacity:0; transform:translate(20px,-20px) scale(0.2); } }
    @keyframes spark4 { 0% { opacity:1; transform:translate(0,0) scale(1); } 100% { opacity:0; transform:translate(-5px,-28px) scale(0.2); } }
    .s1 { animation: spark1 0.8s ease-out infinite; }
    .s2 { animation: spark2 0.9s ease-out 0.2s infinite; }
    .s3 { animation: spark3 0.7s ease-out 0.4s infinite; }
    .s4 { animation: spark4 1s ease-out 0.1s infinite; }
  </style>
  <circle class="s1" cx="25" cy="45" r="3" fill="#F4A226"/>
  <circle class="s2" cx="35" cy="45" r="3" fill="#E63946"/>
  <circle class="s3" cx="30" cy="42" r="2.5" fill="#3A9AD9"/>
  <circle class="s4" cx="28" cy="46" r="2" fill="#FFE57A"/>
</svg>
