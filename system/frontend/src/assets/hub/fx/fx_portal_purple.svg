<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" width="80" height="100">
  <style>
    @keyframes portalBreathe {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    .portal { animation: portalBreathe 1.8s ease-in-out infinite; transform-origin: 40px 50px; }
  </style>
  <ellipse class="portal" cx="40" cy="50" rx="35" ry="45" fill="#7B2FBE" opacity="0.5"/>
  <ellipse class="portal" cx="40" cy="50" rx="22" ry="30" fill="#9B50D9" opacity="0.7"/>
  <ellipse class="portal" cx="40" cy="50" rx="12" ry="16" fill="#C084FC" opacity="0.9"/>
  <ellipse class="portal" cx="40" cy="50" rx="5" ry="7" fill="#ffffff" opacity="0.6"/>
</svg>
