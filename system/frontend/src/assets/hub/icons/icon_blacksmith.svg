<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="ember-glow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#F4A226" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F4A226" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-smith" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Anvil base -->
  <rect x="16" y="44" width="32" height="8" rx="3" fill="#4A7FA5" stroke="#F4A226" stroke-width="2.5"/>
  <!-- Anvil neck/stem -->
  <rect x="22" y="40" width="20" height="6" rx="1" fill="#4A7FA5" stroke="#F4A226" stroke-width="2"/>
  <!-- Anvil top body -->
  <rect x="14" y="32" width="36" height="10" rx="3" fill="#4A7FA5" stroke="#F4A226" stroke-width="2.5"/>
  <!-- Anvil horn (right side) -->
  <path d="M50 36 Q58 35 58 38 Q58 41 50 40" fill="#4A7FA5" stroke="#F4A226" stroke-width="2" stroke-linejoin="round"/>

  <!-- Hammer handle -->
  <line x1="44" y1="14" x2="30" y2="30" stroke="#CD7F32" stroke-width="3" stroke-linecap="round"/>
  <!-- Hammer head -->
  <rect x="38" y="10" width="16" height="10" rx="2.5" fill="#4A7FA5" stroke="#F4A226" stroke-width="2.5" transform="rotate(-45 46 15)"/>

  <!-- Sparks/embers from anvil -->
  <circle cx="34" cy="30" r="2" fill="#F4A226" filter="url(#glow-smith)"/>
  <circle cx="26" cy="26" r="1.5" fill="#F4A226" opacity="0.9" filter="url(#glow-smith)"/>
  <circle cx="30" cy="22" r="1" fill="#F4A226" opacity="0.7"/>

  <!-- Spark lines -->
  <line x1="34" y1="30" x2="28" y2="24" stroke="#F4A226" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="34" y1="30" x2="38" y2="22" stroke="#F4A226" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="34" y1="30" x2="22" y2="28" stroke="#F4A226" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

  <!-- Ember glow under anvil -->
  <ellipse cx="32" cy="52" rx="14" ry="4" fill="url(#ember-glow)" opacity="0.6"/>

  <!-- Hot metal piece on anvil -->
  <rect x="20" y="30" width="14" height="4" rx="1.5" fill="#F4A226" stroke="#CD7F32" stroke-width="1.5" opacity="0.9"/>
</svg>
