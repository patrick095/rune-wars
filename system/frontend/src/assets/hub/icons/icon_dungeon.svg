<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="portal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B2FBE" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7B2FBE" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-dungeon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Cave arch -->
  <path d="M10 52 L10 28 Q10 12 32 12 Q54 12 54 28 L54 52" stroke="#7B2FBE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Portal inner glow -->
  <ellipse cx="32" cy="36" rx="16" ry="18" fill="url(#portal-glow)" opacity="0.6"/>
  <ellipse cx="32" cy="36" rx="10" ry="12" fill="#2D1B4E" opacity="0.9"/>

  <!-- Portal swirl rings -->
  <ellipse cx="32" cy="36" rx="10" ry="12" stroke="#3A9AD9" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>
  <ellipse cx="32" cy="36" rx="6" ry="7" stroke="#7B2FBE" stroke-width="1.5" opacity="0.9" filter="url(#glow-dungeon)"/>

  <!-- Portal center dot -->
  <circle cx="32" cy="36" r="2.5" fill="#3A9AD9" filter="url(#glow-dungeon)"/>

  <!-- Left crystal -->
  <polygon points="16,52 13,40 19,40" fill="#7B2FBE" stroke="#3A9AD9" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="16,45 14,40 18,40" fill="#3A9AD9" opacity="0.5"/>

  <!-- Right crystal -->
  <polygon points="48,52 45,38 51,38" fill="#7B2FBE" stroke="#3A9AD9" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="48,44 46,38 50,38" fill="#3A9AD9" opacity="0.5"/>

  <!-- Top crystal -->
  <polygon points="32,10 29,18 35,18" fill="#7B2FBE" stroke="#3A9AD9" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="32,13 30,18 34,18" fill="#3A9AD9" opacity="0.5"/>

  <!-- Ground line -->
  <line x1="10" y1="52" x2="54" y2="52" stroke="#7B2FBE" stroke-width="2.5" stroke-linecap="round"/>
</svg>
