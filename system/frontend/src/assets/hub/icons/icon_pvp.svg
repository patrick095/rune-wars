<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="glow-pvp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Left sword (diagonal top-left to bottom-right) -->
  <line x1="14" y1="14" x2="50" y2="50" stroke="#E63946" stroke-width="3" stroke-linecap="round"/>
  <!-- Left sword guard -->
  <line x1="18" y1="26" x2="26" y2="18" stroke="#F4A226" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left sword pommel -->
  <circle cx="12" cy="52" r="3" fill="#F4A226" stroke="#E63946" stroke-width="1.5"/>

  <!-- Right sword (diagonal top-right to bottom-left) -->
  <line x1="50" y1="14" x2="14" y2="50" stroke="#E63946" stroke-width="3" stroke-linecap="round"/>
  <!-- Right sword guard -->
  <line x1="46" y1="26" x2="38" y2="18" stroke="#F4A226" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right sword pommel -->
  <circle cx="52" cy="52" r="3" fill="#F4A226" stroke="#E63946" stroke-width="1.5"/>

  <!-- Tips of swords -->
  <circle cx="50" cy="13" r="2" fill="#E63946"/>
  <circle cx="14" cy="13" r="2" fill="#E63946"/>

  <!-- Center rune glow -->
  <circle cx="32" cy="32" r="5" fill="none" stroke="#F4A226" stroke-width="2" filter="url(#glow-pvp)" opacity="0.8"/>
  <circle cx="32" cy="32" r="2.5" fill="#F4A226" opacity="0.9"/>

  <!-- Rune marks on swords -->
  <rect x="28" y="20" width="4" height="2" rx="1" fill="#F4A226" transform="rotate(45 30 21)" opacity="0.8"/>
  <rect x="32" y="42" width="4" height="2" rx="1" fill="#F4A226" transform="rotate(45 34 43)" opacity="0.8"/>
</svg>
