<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="glow-char" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Cloak/cape (back layer) -->
  <path d="M22 26 Q12 28 10 50 L22 50 Z" fill="#7B2FBE" stroke="#9B72CF" stroke-width="1.5" stroke-linejoin="round" opacity="0.8"/>
  <path d="M42 26 Q52 28 54 50 L42 50 Z" fill="#7B2FBE" stroke="#9B72CF" stroke-width="1.5" stroke-linejoin="round" opacity="0.8"/>

  <!-- Body / torso -->
  <rect x="22" y="30" width="20" height="20" rx="4" fill="#9B72CF" stroke="#F4A226" stroke-width="2.5"/>

  <!-- Armor plate detail -->
  <path d="M24 32 Q32 28 40 32" stroke="#F4A226" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Belt buckle -->
  <rect x="28" y="46" width="8" height="4" rx="1.5" fill="#F4A226" stroke="#7B2FBE" stroke-width="1"/>
  <!-- Belt line -->
  <line x1="22" y1="48" x2="28" y2="48" stroke="#F4A226" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="48" x2="42" y2="48" stroke="#F4A226" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="32" cy="22" r="8" fill="#9B72CF" stroke="#F4A226" stroke-width="2.5"/>

  <!-- Hood/hair top -->
  <path d="M24 20 Q26 14 32 14 Q38 14 40 20" fill="#7B2FBE" stroke="#9B72CF" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Eyes -->
  <circle cx="29" cy="22" r="2" fill="#F4A226"/>
  <circle cx="35" cy="22" r="2" fill="#F4A226"/>
  <circle cx="29" cy="22" r="1" fill="#2D1B4E"/>
  <circle cx="35" cy="22" r="1" fill="#2D1B4E"/>

  <!-- Eye shine -->
  <circle cx="29.5" cy="21.5" r="0.5" fill="white"/>
  <circle cx="35.5" cy="21.5" r="0.5" fill="white"/>

  <!-- Weapon (staff/sword right side) -->
  <line x1="46" y1="14" x2="46" y2="52" stroke="#F4A226" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Weapon head -->
  <path d="M46 14 Q42 10 42 14 Q42 18 46 17 Q50 18 50 14 Q50 10 46 14 Z" fill="#9B72CF" stroke="#F4A226" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Rune on weapon -->
  <circle cx="46" cy="16" r="2" fill="#F4A226" filter="url(#glow-char)" opacity="0.9"/>

  <!-- Legs -->
  <rect x="24" y="50" width="7" height="10" rx="2" fill="#7B2FBE" stroke="#9B72CF" stroke-width="2"/>
  <rect x="33" y="50" width="7" height="10" rx="2" fill="#7B2FBE" stroke="#9B72CF" stroke-width="2"/>
</svg>
