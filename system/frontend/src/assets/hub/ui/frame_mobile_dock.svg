<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" fill="none">
  <defs>
    <linearGradient id="dock-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D2470" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#1A0E36" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="dock-border-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A9AD9" stop-opacity="0"/>
      <stop offset="20%" stop-color="#3A9AD9" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7B4FD9" stop-opacity="1"/>
      <stop offset="80%" stop-color="#3A9AD9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3A9AD9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dock-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="dock-glow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="slot-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Main dock body -->
  <rect x="4" y="6" width="352" height="62" rx="18" fill="url(#dock-bg)"/>

  <!-- Shine layer -->
  <rect x="4" y="6" width="352" height="62" rx="18" fill="url(#dock-shine)"/>

  <!-- Outer border -->
  <rect x="2" y="4" width="356" height="66" rx="20" stroke="url(#dock-border-top)" stroke-width="2" filter="url(#dock-glow)"/>

  <!-- Inner border subtle -->
  <rect x="6" y="8" width="348" height="58" rx="16" stroke="#3A9AD9" stroke-width="0.5" opacity="0.3"/>

  <!-- Top center glow bar (runic energy) -->
  <rect x="100" y="6" width="160" height="3" rx="1.5" fill="url(#dock-border-top)" opacity="0.6" filter="url(#dock-glow)"/>

  <!-- 5 icon slot areas (evenly distributed across 360px dock) -->
  <!-- Slot positions: 36, 108, 180, 252, 324 -->

  <!-- Slot 1 (leftmost) -->
  <rect x="12" y="14" width="56" height="48" rx="12" fill="#2D1B4E" stroke="#3A9AD9" stroke-width="1.5" opacity="0.7"/>
  <rect x="14" y="16" width="52" height="44" rx="10" fill="none" stroke="#3A9AD9" stroke-width="0.5" opacity="0.4"/>

  <!-- Slot 2 -->
  <rect x="80" y="14" width="56" height="48" rx="12" fill="#2D1B4E" stroke="#3A9AD9" stroke-width="1.5" opacity="0.7"/>
  <rect x="82" y="16" width="52" height="44" rx="10" fill="none" stroke="#3A9AD9" stroke-width="0.5" opacity="0.4"/>

  <!-- Slot 3 (center - highlighted/active) -->
  <rect x="148" y="10" width="64" height="54" rx="14" fill="#3D2470" stroke="#7B4FD9" stroke-width="2" filter="url(#slot-glow)"/>
  <rect x="150" y="12" width="60" height="50" rx="12" fill="none" stroke="#3A9AD9" stroke-width="1" opacity="0.5"/>
  <!-- Active indicator dot (center slot) -->
  <circle cx="180" cy="68" r="3" fill="#7B4FD9" filter="url(#slot-glow)"/>
  <!-- Center glow highlight -->
  <ellipse cx="180" cy="37" rx="26" ry="22" fill="#7B4FD9" opacity="0.08"/>

  <!-- Slot 4 -->
  <rect x="224" y="14" width="56" height="48" rx="12" fill="#2D1B4E" stroke="#3A9AD9" stroke-width="1.5" opacity="0.7"/>
  <rect x="226" y="16" width="52" height="44" rx="10" fill="none" stroke="#3A9AD9" stroke-width="0.5" opacity="0.4"/>

  <!-- Slot 5 (rightmost) -->
  <rect x="292" y="14" width="56" height="48" rx="12" fill="#2D1B4E" stroke="#3A9AD9" stroke-width="1.5" opacity="0.7"/>
  <rect x="294" y="16" width="52" height="44" rx="10" fill="none" stroke="#3A9AD9" stroke-width="0.5" opacity="0.4"/>

  <!-- Left rune ornament -->
  <path d="M4 36 L1 32 L1 40 Z" fill="#3A9AD9" opacity="0.5"/>
  <!-- Rune marks left edge -->
  <line x1="8" y1="24" x2="8" y2="28" stroke="#3A9AD9" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="8" y1="44" x2="8" y2="48" stroke="#3A9AD9" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Right rune ornament -->
  <path d="M356 36 L359 32 L359 40 Z" fill="#3A9AD9" opacity="0.5"/>
  <!-- Rune marks right edge -->
  <line x1="352" y1="24" x2="352" y2="28" stroke="#3A9AD9" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="352" y1="44" x2="352" y2="48" stroke="#3A9AD9" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Bottom ambient glow -->
  <ellipse cx="180" cy="72" rx="140" ry="8" fill="#3A1B6E" opacity="0.5"/>
</svg>
