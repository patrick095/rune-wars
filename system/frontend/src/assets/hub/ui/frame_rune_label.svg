<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none">
  <defs>
    <filter id="label-glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="label-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1B2A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1A2E45" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="border-glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A9AD9" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#3A9AD9" stop-opacity="1"/>
      <stop offset="70%" stop-color="#3A9AD9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3A9AD9" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background fill -->
  <rect x="2" y="2" width="196" height="36" rx="6" fill="url(#label-bg)"/>

  <!-- Outer border with glow -->
  <rect x="1" y="1" width="198" height="38" rx="7" stroke="url(#border-glow-grad)" stroke-width="2" filter="url(#label-glow)"/>

  <!-- Inner subtle border -->
  <rect x="3" y="3" width="194" height="34" rx="5" stroke="#3A9AD9" stroke-width="0.5" opacity="0.4"/>

  <!-- Left rune corner ornament -->
  <!-- Top-left corner -->
  <path d="M8 6 L6 6 L6 14" stroke="#3A9AD9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8 6 L16 6" stroke="#3A9AD9" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Small rune mark left -->
  <rect x="9" y="10" width="3" height="3" rx="0.5" fill="#3A9AD9" opacity="0.7"/>
  <line x1="10.5" y1="10" x2="10.5" y2="8" stroke="#3A9AD9" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

  <!-- Bottom-left corner -->
  <path d="M8 34 L6 34 L6 26" stroke="#3A9AD9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8 34 L16 34" stroke="#3A9AD9" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Small rune mark left bottom -->
  <rect x="9" y="27" width="3" height="3" rx="0.5" fill="#3A9AD9" opacity="0.7"/>

  <!-- Right rune corner ornament -->
  <!-- Top-right corner -->
  <path d="M192 6 L194 6 L194 14" stroke="#3A9AD9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M192 6 L184 6" stroke="#3A9AD9" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Small rune mark right -->
  <rect x="188" y="10" width="3" height="3" rx="0.5" fill="#3A9AD9" opacity="0.7"/>
  <line x1="189.5" y1="10" x2="189.5" y2="8" stroke="#3A9AD9" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

  <!-- Bottom-right corner -->
  <path d="M192 34 L194 34 L194 26" stroke="#3A9AD9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M192 34 L184 34" stroke="#3A9AD9" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="188" y="27" width="3" height="3" rx="0.5" fill="#3A9AD9" opacity="0.7"/>

  <!-- Center horizontal divider lines (decorative) -->
  <line x1="24" y1="20" x2="86" y2="20" stroke="#3A9AD9" stroke-width="0.75" opacity="0.4" stroke-linecap="round"/>
  <line x1="114" y1="20" x2="176" y2="20" stroke="#3A9AD9" stroke-width="0.75" opacity="0.4" stroke-linecap="round"/>

  <!-- Center rune diamond ornament -->
  <rect x="95" y="15" width="10" height="10" rx="1" fill="none" stroke="#3A9AD9" stroke-width="1.5" transform="rotate(45 100 20)" filter="url(#label-glow)" opacity="0.8"/>
  <circle cx="100" cy="20" r="2" fill="#3A9AD9" opacity="0.7"/>

  <!-- Subtle glow line top edge -->
  <line x1="20" y1="2" x2="180" y2="2" stroke="#3A9AD9" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
</svg>
