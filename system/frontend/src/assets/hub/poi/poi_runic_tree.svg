<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <!-- Shadow -->
  <ellipse cx="80" cy="195" rx="50" ry="10" fill="#000" opacity="0.2"/>
  <!-- Trunk -->
  <rect x="65" y="110" width="30" height="80" rx="8" fill="#5C3A1E"/>
  <rect x="70" y="120" width="8" height="60" rx="3" fill="#7A5230" opacity="0.5"/>
  <!-- Roots -->
  <path d="M65 180 Q45 190 30 195" stroke="#5C3A1E" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M95 180 Q115 190 130 195" stroke="#5C3A1E" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M75 185 Q70 195 65 200" stroke="#5C3A1E" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Glowing roots -->
  <path d="M65 180 Q45 190 30 195" stroke="#3A9AD9" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M95 180 Q115 190 130 195" stroke="#3A9AD9" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Canopy layers -->
  <ellipse cx="80" cy="110" rx="65" ry="50" fill="#1a5c2a"/>
  <ellipse cx="80" cy="90" rx="52" ry="42" fill="#2D7A3A"/>
  <ellipse cx="80" cy="68" rx="40" ry="35" fill="#4CAF50"/>
  <ellipse cx="80" cy="50" rx="28" ry="26" fill="#6BCB77"/>
  <!-- Rune markings on trunk -->
  <g stroke="#3A9AD9" stroke-width="1.5" fill="none">
    <path d="M72 135 L76 125 L80 135 M74 131 L78 131"/>
    <path d="M82 150 L86 140 L90 150 M84 146 L88 146"/>
    <circle cx="80" cy="162" r="4" fill="#3A9AD9" opacity="0.8"/>
  </g>
  <!-- Glow -->
  <ellipse cx="80" cy="80" rx="70" ry="60" fill="#3A9AD9" opacity="0.08"/>
  <!-- Floating rune particles -->
  <circle cx="50" cy="70" r="3" fill="#3A9AD9" opacity="0.7"/>
  <circle cx="110" cy="60" r="2" fill="#3A9AD9" opacity="0.5"/>
  <circle cx="40" cy="95" r="2" fill="#4CAF50" opacity="0.6"/>
  <circle cx="120" cy="85" r="3" fill="#4CAF50" opacity="0.5"/>
</svg>
