<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <!-- Shadow -->
  <ellipse cx="80" cy="195" rx="58" ry="8" fill="#000" opacity="0.2"/>
  <!-- Ground field -->
  <ellipse cx="80" cy="188" rx="65" ry="12" fill="#3d7a22" opacity="0.5"/>
  <!-- Building -->
  <rect x="35" y="130" width="90" height="62" rx="3" fill="#1A3A5C"/>
  <rect x="38" y="133" width="84" height="58" fill="#2A5A8C"/>
  <!-- Pointed roof (academy tower) -->
  <polygon points="60,130 80,90 100,130" fill="#1A3A5C"/>
  <polygon points="63,130 80,93 97,130" fill="#2A5A8C"/>
  <!-- Tower top -->
  <circle cx="80" cy="88" r="8" fill="#3A9AD9"/>
  <circle cx="80" cy="88" r="5" fill="#5BC4F5"/>
  <!-- Targets/training dummies -->
  <g>
    <!-- Target left -->
    <circle cx="22" cy="155" r="14" fill="none" stroke="#E63946" stroke-width="2.5"/>
    <circle cx="22" cy="155" r="9" fill="none" stroke="#E63946" stroke-width="2"/>
    <circle cx="22" cy="155" r="4" fill="#E63946"/>
    <rect x="20" y="169" width="4" height="18" fill="#7A5230"/>
    <!-- Target right -->
    <circle cx="138" cy="155" r="14" fill="none" stroke="#3A9AD9" stroke-width="2.5"/>
    <circle cx="138" cy="155" r="9" fill="none" stroke="#3A9AD9" stroke-width="2"/>
    <circle cx="138" cy="155" r="4" fill="#3A9AD9"/>
    <rect x="136" y="169" width="4" height="18" fill="#7A5230"/>
  </g>
  <!-- Training mannequin -->
  <g>
    <circle cx="80" cy="152" r="7" fill="#4A6A8A"/>
    <rect x="74" y="159" width="12" height="18" rx="2" fill="#4A6A8A"/>
    <rect x="62" y="160" width="10" height="4" rx="2" fill="#4A6A8A"/>
    <rect x="88" y="160" width="10" height="4" rx="2" fill="#4A6A8A"/>
    <rect x="76" y="177" width="4" height="10" rx="2" fill="#4A6A8A"/>
    <rect x="80" y="177" width="4" height="10" rx="2" fill="#4A6A8A"/>
  </g>
  <!-- Rune floor pattern -->
  <g stroke="#3A9AD9" stroke-width="1" fill="none" opacity="0.4">
    <circle cx="80" cy="190" r="20"/>
    <path d="M80 170 L80 175 M70 178 L75 180 M90 178 L85 180"/>
  </g>
  <!-- Windows -->
  <rect x="50" y="145" width="14" height="16" rx="2" fill="#3A9AD9" opacity="0.7"/>
  <rect x="96" y="145" width="14" height="16" rx="2" fill="#3A9AD9" opacity="0.7"/>
  <!-- Glow -->
  <ellipse cx="80" cy="150" rx="60" ry="45" fill="#3A9AD9" opacity="0.06"/>
</svg>
