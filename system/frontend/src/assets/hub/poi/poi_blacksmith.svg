<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <!-- Shadow -->
  <ellipse cx="80" cy="195" rx="55" ry="8" fill="#000" opacity="0.2"/>
  <!-- Building -->
  <rect x="30" y="120" width="100" height="75" rx="3" fill="#3A5068"/>
  <rect x="33" y="123" width="94" height="70" fill="#4A7FA5"/>
  <!-- Roof -->
  <polygon points="22,120 80,88 138,120" fill="#2D4A5C"/>
  <polygon points="25,120 80,91 135,120" fill="#3D6080"/>
  <!-- Chimney -->
  <rect x="95" y="72" width="14" height="32" fill="#2D4A5C"/>
  <!-- Smoke/sparks from chimney -->
  <g fill="#F4A226" opacity="0.6">
    <circle cx="102" cy="68" r="4"/>
    <circle cx="108" cy="60" r="3"/>
    <circle cx="98" cy="55" r="2.5"/>
    <circle cx="106" cy="50" r="2"/>
    <circle cx="100" cy="45" r="1.5"/>
  </g>
  <!-- Forge/fire -->
  <ellipse cx="80" cy="165" rx="25" ry="15" fill="#1a2a3a"/>
  <ellipse cx="80" cy="162" rx="18" ry="10" fill="#E63946" opacity="0.8"/>
  <ellipse cx="80" cy="160" rx="12" ry="7" fill="#F4A226"/>
  <ellipse cx="80" cy="158" rx="6" ry="4" fill="#FFE57A"/>
  <!-- Anvil -->
  <rect x="55" y="155" width="30" height="8" rx="2" fill="#6A6A8A"/>
  <rect x="58" y="163" width="8" height="12" fill="#5A5A7A"/>
  <rect x="70" y="163" width="8" height="12" fill="#5A5A7A"/>
  <!-- Hammer -->
  <g>
    <rect x="95" y="140" width="8" height="20" rx="2" fill="#7A5230" transform="rotate(-30 99 150)"/>
    <rect x="90" y="138" width="18" height="10" rx="2" fill="#6A6A8A" transform="rotate(-30 99 143)"/>
  </g>
  <!-- Blue magic sparks -->
  <g fill="#3A9AD9" opacity="0.8">
    <circle cx="70" cy="150" r="2.5"/>
    <circle cx="90" cy="148" r="2"/>
    <circle cx="75" cy="145" r="1.5"/>
    <circle cx="85" cy="152" r="2"/>
  </g>
  <!-- Window with fire glow -->
  <rect x="45" y="135" width="20" height="20" rx="2" fill="#1a2a3a"/>
  <rect x="47" y="137" width="16" height="16" fill="#E63946" opacity="0.5"/>
  <rect x="100" y="135" width="20" height="20" rx="2" fill="#1a2a3a"/>
  <rect x="102" y="137" width="16" height="16" fill="#F4A226" opacity="0.5"/>
  <!-- Glow -->
  <ellipse cx="80" cy="160" rx="35" ry="25" fill="#4A7FA5" opacity="0.1"/>
</svg>
