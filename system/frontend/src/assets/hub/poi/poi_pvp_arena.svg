  <g stroke="#F4A226" stroke-width="3" stroke-linecap="round">
    <line x1="60" y1="148" x2="100" y2="170"/>
    <line x1="100" y1="148" x2="60" y2="170"/>
    <!-- Sword handles -->
    <line x1="56" y1="145" x2="64" y2="151" stroke-width="4"/>
    <line x1="96" y1="145" x2="104" y2="151" stroke-width="4"/>
  </g>
  <!-- Banners -->
  <g>
    <rect x="25" y="100" width="6" height="50" fill="#5a1010"/>
    <polygon points="31,100 31,120 45,112" fill="#E63946"/>
    <rect x="129" y="100" width="6" height="50" fill="#5a1010"/>
    <polygon points="129,100 129,120 115,112" fill="#E63946"/>
  </g>
  <!-- Rune glow accents -->
  <g stroke="#E63946" fill="none" opacity="0.6">
    <path d="M65 130 L70 122 L75 130 M67 127 L73 127"/>
    <path d="M85 130 L90 122 L95 130 M87 127 L93 127"/>
  </g>
  <!-- Top glow -->
