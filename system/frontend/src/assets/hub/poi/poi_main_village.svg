<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <!-- Shadow -->
  <ellipse cx="80" cy="196" rx="60" ry="8" fill="#000" opacity="0.2"/>
  <!-- Ground -->
  <ellipse cx="80" cy="188" rx="65" ry="12" fill="#3d7a22" opacity="0.5"/>
  <!-- Main building -->
  <rect x="50" y="120" width="60" height="70" rx="2" fill="#8B6914"/>
  <rect x="52" y="122" width="56" height="66" fill="#C49A2A"/>
  <!-- Main roof -->
  <polygon points="40,120 80,85 120,120" fill="#E8A020"/>
  <polygon points="42,120 80,88 118,120" fill="#F4A226"/>
  <!-- Left small house -->
  <rect x="15" y="145" width="38" height="45" rx="2" fill="#A07820"/>
  <polygon points="8,145 34,120 60,145" fill="#D4921C"/>
  <!-- Right small house -->
  <rect x="107" y="148" width="38" height="42" rx="2" fill="#A07820"/>
  <polygon points="100,148 126,123 152,148" fill="#D4921C"/>
  <!-- Windows (main) -->
  <rect x="60" y="135" width="15" height="18" rx="2" fill="#FFE57A"/>
  <rect x="85" y="135" width="15" height="18" rx="2" fill="#FFE57A"/>
  <rect x="70" y="160" width="20" height="30" rx="2" fill="#8B6914"/>
  <!-- Windows small houses -->
  <rect x="25" y="155" width="12" height="14" rx="1" fill="#FFE57A"/>
  <rect x="117" y="157" width="12" height="14" rx="1" fill="#FFE57A"/>
  <!-- Chimney smoke accent -->
  <path d="M95 85 Q100 75 95 65 Q102 60 97 52" stroke="#F4A226" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <!-- Flowers -->
  <g>
    <circle cx="50" cy="183" r="4" fill="#F4A226"/>
    <circle cx="110" cy="183" r="4" fill="#4CAF50"/>
    <circle cx="130" cy="185" r="3" fill="#F4A226"/>
  </g>
  <!-- Golden glow -->
  <ellipse cx="80" cy="140" rx="65" ry="50" fill="#F4A226" opacity="0.07"/>
</svg>
