<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <!-- Shadow -->
  <ellipse cx="80" cy="195" rx="55" ry="8" fill="#000" opacity="0.2"/>
  <!-- Ground -->
  <ellipse cx="80" cy="190" rx="60" ry="10" fill="#3d7a22" opacity="0.4"/>
  <!-- Main tent pole -->
  <rect x="77" y="80" width="6" height="115" fill="#7A5230"/>
  <!-- Main tent canopy -->
  <path d="M20 130 Q80 80 140 130 Q130 140 80 135 Q30 140 20 130 Z" fill="#CD7F32"/>
  <path d="M25 132 Q80 84 135 132" fill="#F4A226" opacity="0.7"/>
  <!-- Tent stripes -->
  <g opacity="0.4">
    <path d="M50 125 Q80 85 110 125" stroke="#8B4513" stroke-width="2" fill="none"/>
    <path d="M60 128 Q80 86 100 128" stroke="#8B4513" stroke-width="2" fill="none"/>
  </g>
  <!-- Lanterns -->
  <g>
    <line x1="30" y1="100" x2="30" y2="115" stroke="#7A5230" stroke-width="2"/>
    <ellipse cx="30" cy="118" rx="7" ry="9" fill="#F4A226"/>
    <rect x="26" y="115" width="8" height="6" fill="#FFE57A" opacity="0.8"/>

    <line x1="130" y1="100" x2="130" y2="115" stroke="#7A5230" stroke-width="2"/>
    <ellipse cx="130" cy="118" rx="7" ry="9" fill="#F4A226"/>
    <rect x="126" y="115" width="8" height="6" fill="#FFE57A" opacity="0.8"/>
  </g>
  <!-- Chest -->
  <rect x="25" y="160" width="35" height="28" rx="3" fill="#7A5230"/>
  <rect x="25" y="160" width="35" height="12" rx="3" fill="#8B6330"/>
  <rect x="38" y="162" width="10" height="8" rx="2" fill="#CD7F32"/>
  <!-- Scale/balance -->
  <g>
    <line x1="80" y1="145" x2="80" y2="165" stroke="#CD7F32" stroke-width="2"/>
    <line x1="60" y1="158" x2="100" y2="158" stroke="#CD7F32" stroke-width="2"/>
    <ellipse cx="62" cy="162" rx="10" ry="6" fill="#F4A226" opacity="0.8"/>
    <ellipse cx="98" cy="162" rx="10" ry="6" fill="#F4A226" opacity="0.8"/>
  </g>
  <!-- Coins scattered -->
  <g fill="#F4A226">
    <circle cx="110" cy="175" r="5"/>
    <circle cx="120" cy="170" r="4"/>
    <circle cx="125" cy="180" r="5"/>
    <circle cx="115" cy="182" r="3"/>
  </g>
  <!-- Glow -->
  <ellipse cx="80" cy="130" rx="60" ry="40" fill="#CD7F32" opacity="0.08"/>
