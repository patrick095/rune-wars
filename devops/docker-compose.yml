services:
  frontend:
    build:
      context: ../system/frontend
      dockerfile: ../../devops/frontend/Dockerfile
      target: runner
    ports:
      - "4200:80"
    environment:
      - ANGULAR_ENV=${ANGULAR_ENV:-production}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend-dev:
    build:
      context: ../system/frontend
      dockerfile: ../../devops/frontend/Dockerfile
      target: dev
    ports:
      - "4200:4200"
    volumes:
      - ../system/frontend:/app
      - /app/node_modules
    environment:
      - ANGULAR_ENV=${ANGULAR_ENV:-development}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
